services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=tonibyte
      - DB_USER=tonibyte
      - DB_PASSWORD=tonibytepass
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=tonibyte
      - POSTGRES_USER=tonibyte
      - POSTGRES_PASSWORD=tonibytepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: