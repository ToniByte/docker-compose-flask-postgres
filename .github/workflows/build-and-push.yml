name: Build and Push Image
 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tonibyte/flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test for app
        if: github.event_name == 'pull_request'
        run: |
          docker build -t test-app:pr .
          docker run -d --name test-app -p 5000:5000 test-app:pr
          sleep 5
          curl -f http://localhost:5000
          docker rm -f test-app

      - name: Update GitOps image tag
        if: github.event_name == 'push'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_SHA::7}"
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/ToniByte/k8s-helm-flask-gitops.git gitops
          cd gitops

          # update tag in values.yaml
          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" charts/flask-app/values.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add charts/flask-app/values.yaml
          git commit -m "chore: update flask-app image tag to ${TAG}" || echo "No changes"
          git push